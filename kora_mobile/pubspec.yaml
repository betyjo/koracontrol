name: kora_mobile
description: "Kora Control — Mobile app for individual water-utility customers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.4
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_markdown: ^0.7.4+3

  # Payments + browser
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # Feedback
  fluttertoast: ^8.2.9
  pinput: ^5.0.1

  # Utilities
  uuid: ^4.5.1
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
