# Localization configuration for Kora Mobile.
# The app supports English (en) and Amharic (am) — matching the web app.
#
# To regenerate ARB bindings after editing .arb files:
#   flutter gen-l10n
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
