<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="tankGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2038;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1525;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pipeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a4a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0a1525" rx="10"/>

  <!-- Pipes -->
  <!-- Horizontal Pipe 1 (Top) -->
  <rect x="50" y="80" width="700" height="20" fill="url(#pipeGradient)" stroke="#00d4ff" stroke-width="1"/>
  <rect x="50" y="85" width="700" height="10" fill="#00d4ff" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Horizontal Pipe 2 (Middle) -->
  <rect x="50" y="180" width="700" height="20" fill="url(#pipeGradient)" stroke="#00d4ff" stroke-width="1"/>
  <rect x="50" y="185" width="700" height="10" fill="#00d4ff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Horizontal Pipe 3 (Bottom) -->
  <rect x="50" y="280" width="700" height="20" fill="url(#pipeGradient)" stroke="#00d4ff" stroke-width="1"/>
  <rect x="50" y="285" width="700" height="10" fill="#00d4ff" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Vertical Connectors -->
  <rect x="150" y="80" width="20" height="220" fill="url(#pipeGradient)" stroke="#00d4ff" stroke-width="1"/>
  <rect x="155" y="85" width="10" height="210" fill="#00d4ff" opacity="0.3"/>

  <rect x="400" y="80" width="20" height="220" fill="url(#pipeGradient)" stroke="#00d4ff" stroke-width="1"/>
  <rect x="405" y="85" width="10" height="210" fill="#00d4ff" opacity="0.3"/>

  <rect x="650" y="80" width="20" height="220" fill="url(#pipeGradient)" stroke="#00d4ff" stroke-width="1"/>
  <rect x="655" y="85" width="10" height="210" fill="#00d4ff" opacity="0.3"/>

  <!-- Treatment Tank -->
  <rect x="200" y="130" width="200" height="150" fill="url(#tankGradient)" stroke="#00ff9d" stroke-width="2" rx="5" filter="url(#shadow)"/>
  
  <!-- Water Level in Tank -->
  <rect x="205" y="180" width="190" height="95" fill="url(#waterGradient)" rx="3" opacity="0.8">
    <animate attributeName="height" values="95;90;95" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="180;185;180" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Tank Bubbles -->
  <circle cx="250" cy="200" r="3" fill="#00ff9d" opacity="0.6">
    <animate attributeName="cy" values="200;170;200" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="210" r="2" fill="#00ff9d" opacity="0.5">
    <animate attributeName="cy" values="210;175;210" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="195" r="2.5" fill="#00ff9d" opacity="0.7">
    <animate attributeName="cy" values="195;165;195" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Tank Label -->
  <text x="300" y="300" font-family="Arial, sans-serif" font-size="12" fill="#00ff9d" text-anchor="middle" font-weight="bold">TREATMENT TANK</text>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="10" fill="#b8c5d6" text-anchor="middle">Level: 78%</text>

  <!-- Pump 1 -->
  <circle cx="160" cy="90" r="25" fill="#0d2038" stroke="#00ff9d" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="160" cy="90" r="20" fill="#0a1525"/>
  <line x1="160" y1="70" x2="160" y2="110" stroke="#00ff9d" stroke-width="3">
    <animate attributeName="stroke-width" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="140" y1="90" x2="180" y2="90" stroke="#00ff9d" stroke-width="3">
    <animate attributeName="stroke-width" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="10" fill="#00ff9d" text-anchor="middle">PUMP 1</text>

  <!-- Pump 2 -->
  <circle cx="660" cy="90" r="25" fill="#0d2038" stroke="#00ff9d" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="660" cy="90" r="20" fill="#0a1525"/>
  <line x1="660" y1="70" x2="660" y2="110" stroke="#00ff9d" stroke-width="3">
    <animate attributeName="stroke-width" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="640" y1="90" x2="680" y2="90" stroke="#00ff9d" stroke-width="3">
    <animate attributeName="stroke-width" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="660" y="130" font-family="Arial, sans-serif" font-size="10" fill="#00ff9d" text-anchor="middle">PUMP 2</text>

  <!-- Inlet Valve -->
  <path d="M60 80 L80 90 L60 100 L40 90 Z" fill="#00ff9d" stroke="#00d4ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="10" fill="#00ff9d" text-anchor="middle">INLET</text>

  <!-- Outlet Valve -->
  <path d="M740 80 L760 90 L740 100 L720 90 Z" fill="#00ff9d" stroke="#00d4ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="120" font-family="Arial, sans-serif" font-size="10" fill="#00ff9d" text-anchor="middle">OUTLET</text>

  <!-- Flow Arrows -->
  <polygon points="100,85 110,90 100,95" fill="#00ff9d" filter="url(#glow)">
    <animate attributeName="points" values="100,85 110,90 100,95;150,85 160,90 150,95;100,85 110,90 100,95" dur="3s" repeatCount="indefinite"/>
  </polygon>
  
  <polygon points="250,185 260,190 250,195" fill="#00ff9d" filter="url(#glow)">
    <animate attributeName="points" values="250,185 260,190 250,195;300,185 310,190 300,195;250,185 260,190 250,195" dur="2.5s" repeatCount="indefinite"/>
  </polygon>
  
  <polygon points="500,85 510,90 500,95" fill="#00ff9d" filter="url(#glow)">
    <animate attributeName="points" values="500,85 510,90 500,95;550,85 560,90 550,95;500,85 510,90 500,95" dur="3.5s" repeatCount="indefinite"/>
  </polygon>

  <!-- Status Indicators -->
  <rect x="580" y="30" width="120" height="25" fill="#0d2038" stroke="#00ff9d" stroke-width="1" rx="3"/>
  <text x="640" y="47" font-family="Arial, sans-serif" font-size="11" fill="#00ff9d" text-anchor="middle">SYSTEM ONLINE</text>
  
  <rect x="580" y="60" width="120" height="25" fill="#0d2038" stroke="#ff9d00" stroke-width="1" rx="3"/>
  <text x="640" y="77" font-family="Arial, sans-serif" font-size="11" fill="#ff9d00" text-anchor="middle">1 WARNING</text>

  <!-- Process Flow Labels -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="14" fill="#00d4ff" text-anchor="middle" font-weight="bold">WATER TREATMENT PROCESS FLOW</text>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="10" fill="#5a7a9a" text-anchor="middle">Real-time Visualization</text>

</svg>
