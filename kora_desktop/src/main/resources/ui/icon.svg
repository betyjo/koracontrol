<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0d2038" stroke="#00ff9d" stroke-width="3"/>
  
  <!-- Water Drop -->
  <path d="M100 30 C100 30 60 80 60 115 C60 145 75 165 100 165 C125 165 140 145 140 115 C140 80 100 30 100 30 Z" 
        fill="#00d4ff" stroke="#00ff9d" stroke-width="2">
    <animate attributeName="fill" values="#00d4ff;#00ff9d;#00d4ff" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Inner Water Level Lines -->
  <path d="M75 120 Q100 110 125 120" fill="none" stroke="#071426" stroke-width="2" opacity="0.6">
    <animate attributeName="d" values="M75 120 Q100 110 125 120;M75 125 Q100 115 125 125;M75 120 Q100 110 125 120" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M70 135 Q100 125 130 135" fill="none" stroke="#071426" stroke-width="2" opacity="0.6">
    <animate attributeName="d" values="M70 135 Q100 125 130 135;M70 140 Q100 130 130 140;M70 135 Q100 125 130 135" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <!-- Control Symbol -->
  <circle cx="100" cy="100" r="15" fill="#071426" stroke="#00ff9d" stroke-width="2"/>
  <path d="M100 88 L100 112 M88 100 L112 100" stroke="#00ff9d" stroke-width="3" stroke-linecap="round"/>
</svg>
